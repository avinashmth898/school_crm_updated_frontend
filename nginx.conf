# Served by the `frontend` container in backend/docker-compose.yml.
#
# Ships in HTTP-only mode by default so the stack boots cleanly before any
# domain/certificate exists (an HTTPS server block referencing a
# nonexistent cert file would crash Nginx on first start). Once you have a
# domain or free DuckDNS/sslip.io hostname pointed at this VM, follow
# DEPLOYMENT.md's "Enable HTTPS" section, which issues a cert via the
# certbot service and uncomments the HTTPS block below.

server {
    listen 80;
    server_name _;

    # Required for Let's Encrypt's HTTP-01 challenge (certbot service
    # writes here; shared via the certbot_webroot volume).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API — proxied straight to the backend container, same-origin, so the
    # frontend's apiClient.js (base URL "/api") needs no configuration.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA — unknown paths fall back to index.html so client-side
    # routing (react-router-dom) works on a hard refresh/direct link.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

